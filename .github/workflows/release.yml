name: Release PortMaster package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Validate metadata and Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit shellcheck openssl
          luajit tests/session_start.lua
          luajit tests/auth_input.lua
          luajit tests/sponsored.lua
          luajit tests/handheld_regressions.lua
          luajit tests/chat_browsing.lua
          luajit tests/message_reader.lua
          luajit tests/key_store_linux.lua "$(mktemp -d)"
          python3 -B -m unittest discover -s tests -p test_updater.py
          shellcheck build_portmaster.sh
          shellcheck tools/build-tdlib.sh
          shellcheck -e SC1090,SC1091,SC2086 'portmaster/SPgram.sh'
          jq empty portmaster/port.json release-manifest.json
      - name: Build package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: bash build_portmaster.sh "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY"
      - name: Validate built archive
        run: |
          (cd dist && sha256sum --check --strict -- SPgram-PortMaster-v*.zip.sha256 SPgram-Update-v*.zip.sha256)
          python3 tests/check_install_overlay.py dist/SPgram-PortMaster-v*.zip
          unzip -q dist/SPgram-PortMaster-v*.zip -d build
          find build -name '*.lua' -print0 | xargs -0 -I '{}' luajit -b '{}' /dev/null
          readelf -h -d -V build/telegramsp/gamedata/lib/libtdjson.so
      - uses: actions/upload-artifact@v4
        with:
          name: SPgram-PortMaster-v${{ steps.version.outputs.value }}
          path: dist/
